name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
        deps: [with, without]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.deps == 'with'
        run: pip install -r requirements.txt
      - run: python tests/test_server.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t tape-deck-server .
      - name: Starts and answers
        run: |
          mkdir -p music/Artist/Album
          docker run -d --name tds-open -p 8080:8080 -v "$PWD/music:/music:ro" tape-deck-server
          for i in $(seq 30); do curl -fs -o page.html http://127.0.0.1:8080/library.html && break; sleep 1; done
          grep -q "const TRACKS = " page.html
          test "$(docker inspect -f '{{.Config.User}}' tds-open)" = tapedeck
          docker logs tds-open
      - name: Asks for the password through a published port
        run: |
          docker run -d --name tds-password -p 8081:8080 -v "$PWD/music:/music:ro" -e TAPE_PASSWORD=secret tape-deck-server
          for i in $(seq 30); do curl -fs -o login.html http://127.0.0.1:8081/library.html && break; sleep 1; done
          grep -q 'action="/login"' login.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/favs)" = 401
